[project]
name = "smart-stock"
version = "0.1.0"
description = "주식 시세 및 거래 전략 샌드박스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "finance-datareader>=0.9",
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["smart_stock"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
